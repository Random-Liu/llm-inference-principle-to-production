<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="100%" height="100%">
  <style>
    .box { stroke: #4A5568; stroke-width: 1.5; fill: #FFF; rx: 8; }
    .title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: #1A202C; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #4A5568; }
    .label { font-family: 'Inter', sans-serif; font-size: 12px; fill: #2D3748; text-anchor: middle; }
    .label-gpu { font-family: 'Inter', sans-serif; font-size: 10px; fill: #4A5568; text-anchor: middle; }
    .arrow { stroke: #718096; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .bi-arrow { stroke: #718096; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); fill: none; }
    .node-box { stroke: #2B6CB0; stroke-width: 2; fill: #EBF8FF; rx: 6; }
    .gpu-box { stroke: #718096; stroke-width: 1; fill: #EDF2F7; rx: 2; }
    .bus { fill: #2B6CB0; rx: 3; }
    .conn-tp { stroke: #2B6CB0; stroke-width: 1.5; }
    .conn-cp { stroke: #C53030; stroke-width: 2; }
    .conn-pp { stroke: #D69E2E; stroke-width: 2; }
    .text-tp { fill: #2B6CB0; font-weight: bold; }
    .text-cp { fill: #C53030; font-weight: bold; }
    .text-pp { fill: #D69E2E; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7FAFC" />

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle" font-size="18">三维并行拓扑 (TP + PP + CP) 物理图景</text>

  <!-- PP Stage 2 -->
  <rect x="50" y="60" width="700" height="220" class="box" fill="#FFF5F5" stroke="#FEB2B2" />
  <text x="70" y="85" class="title text-pp">流水线阶段 2 (PP Stage 2: 负责 41-80 层)</text>

  <!-- CP Node C -->
  <rect x="80" y="100" width="300" height="160" class="node-box" />
  <text x="230" y="120" class="label title">节点 C (处理 1 - 500K Token)</text>
  <text x="230" y="135" class="subtitle label">机内 TP=8</text>
  <text x="230" y="150" class="subtitle label">📦 权重：41-80层切片</text>
  <text x="230" y="165" class="subtitle label">💾 KV Cache：1-500K Token (41-80层)</text>
  <!-- GPUs -->
  <g transform="translate(80, 20)">
    <rect x="22" y="150" width="25" height="30" class="gpu-box" /><text x="34.5" y="168" class="label-gpu">G1</text>
    <rect x="55" y="150" width="25" height="30" class="gpu-box" /><text x="67.5" y="168" class="label-gpu">G2</text>
    <rect x="88" y="150" width="25" height="30" class="gpu-box" /><text x="100.5" y="168" class="label-gpu">G3</text>
    <rect x="121" y="150" width="25" height="30" class="gpu-box" /><text x="133.5" y="168" class="label-gpu">G4</text>
    <rect x="154" y="150" width="25" height="30" class="gpu-box" /><text x="166.5" y="168" class="label-gpu">G5</text>
    <rect x="187" y="150" width="25" height="30" class="gpu-box" /><text x="199.5" y="168" class="label-gpu">G6</text>
    <rect x="220" y="150" width="25" height="30" class="gpu-box" /><text x="232.5" y="168" class="label-gpu">G7</text>
    <rect x="253" y="150" width="25" height="30" class="gpu-box" /><text x="265.5" y="168" class="label-gpu">G8</text>
    <!-- NVSwitch Bus -->
    <rect x="22" y="200" width="256" height="6" class="bus" />
    <!-- Connections -->
    <line x1="34.5" y1="180" x2="34.5" y2="200" class="conn-tp" />
    <line x1="67.5" y1="180" x2="67.5" y2="200" class="conn-tp" />
    <line x1="100.5" y1="180" x2="100.5" y2="200" class="conn-tp" />
    <line x1="133.5" y1="180" x2="133.5" y2="200" class="conn-tp" />
    <line x1="166.5" y1="180" x2="166.5" y2="200" class="conn-tp" />
    <line x1="199.5" y1="180" x2="199.5" y2="200" class="conn-tp" />
    <line x1="232.5" y1="180" x2="232.5" y2="200" class="conn-tp" />
    <line x1="265.5" y1="180" x2="265.5" y2="200" class="conn-tp" />
  </g>

  <!-- CP Node D -->
  <rect x="420" y="100" width="300" height="160" class="node-box" />
  <text x="570" y="120" class="label title">节点 D (处理 500K - 1M Token)</text>
  <text x="570" y="135" class="subtitle label">机内 TP=8</text>
  <text x="570" y="150" class="subtitle label">📦 权重：41-80层切片</text>
  <text x="570" y="165" class="subtitle label">💾 KV Cache：500K-1M Token (41-80层)</text>
  <!-- GPUs -->
  <g transform="translate(420, 20)">
    <rect x="22" y="150" width="25" height="30" class="gpu-box" /><text x="34.5" y="168" class="label-gpu">G1</text>
    <rect x="55" y="150" width="25" height="30" class="gpu-box" /><text x="67.5" y="168" class="label-gpu">G2</text>
    <rect x="88" y="150" width="25" height="30" class="gpu-box" /><text x="100.5" y="168" class="label-gpu">G3</text>
    <rect x="121" y="150" width="25" height="30" class="gpu-box" /><text x="133.5" y="168" class="label-gpu">G4</text>
    <rect x="154" y="150" width="25" height="30" class="gpu-box" /><text x="166.5" y="168" class="label-gpu">G5</text>
    <rect x="187" y="150" width="25" height="30" class="gpu-box" /><text x="199.5" y="168" class="label-gpu">G6</text>
    <rect x="220" y="150" width="25" height="30" class="gpu-box" /><text x="232.5" y="168" class="label-gpu">G7</text>
    <rect x="253" y="150" width="25" height="30" class="gpu-box" /><text x="265.5" y="168" class="label-gpu">G8</text>
    <!-- NVSwitch Bus -->
    <rect x="22" y="200" width="256" height="6" class="bus" />
    <!-- Connections -->
    <line x1="34.5" y1="180" x2="34.5" y2="200" class="conn-tp" />
    <line x1="67.5" y1="180" x2="67.5" y2="200" class="conn-tp" />
    <line x1="100.5" y1="180" x2="100.5" y2="200" class="conn-tp" />
    <line x1="133.5" y1="180" x2="133.5" y2="200" class="conn-tp" />
    <line x1="166.5" y1="180" x2="166.5" y2="200" class="conn-tp" />
    <line x1="199.5" y1="180" x2="199.5" y2="200" class="conn-tp" />
    <line x1="232.5" y1="180" x2="232.5" y2="200" class="conn-tp" />
    <line x1="265.5" y1="180" x2="265.5" y2="200" class="conn-tp" />
  </g>

  <!-- CP Communication Stage 2 -->
  <line x1="380" y1="170" x2="420" y2="170" class="bi-arrow conn-cp" />
  <text x="400" y="160" class="subtitle label text-cp">CP 环形通信</text>

  <!-- PP Stage 1 -->
  <rect x="50" y="340" width="700" height="220" class="box" fill="#EBF8FF" stroke="#BEE3F8" />
  <text x="70" y="365" class="title text-pp">流水线阶段 1 (PP Stage 1: 负责 1-40 层)</text>

  <!-- CP Node A -->
  <rect x="80" y="380" width="300" height="160" class="node-box" />
  <text x="230" y="400" class="label title">节点 A (处理 1 - 500K Token)</text>
  <text x="230" y="415" class="subtitle label">机内 TP=8</text>
  <text x="230" y="430" class="subtitle label">📦 权重：1-40层切片</text>
  <text x="230" y="445" class="subtitle label">💾 KV Cache：1-500K Token (1-40层)</text>
  <!-- GPUs -->
  <g transform="translate(80, 300)">
    <rect x="22" y="150" width="25" height="30" class="gpu-box" /><text x="34.5" y="168" class="label-gpu">G1</text>
    <rect x="55" y="150" width="25" height="30" class="gpu-box" /><text x="67.5" y="168" class="label-gpu">G2</text>
    <rect x="88" y="150" width="25" height="30" class="gpu-box" /><text x="100.5" y="168" class="label-gpu">G3</text>
    <rect x="121" y="150" width="25" height="30" class="gpu-box" /><text x="133.5" y="168" class="label-gpu">G4</text>
    <rect x="154" y="150" width="25" height="30" class="gpu-box" /><text x="166.5" y="168" class="label-gpu">G5</text>
    <rect x="187" y="150" width="25" height="30" class="gpu-box" /><text x="199.5" y="168" class="label-gpu">G6</text>
    <rect x="220" y="150" width="25" height="30" class="gpu-box" /><text x="232.5" y="168" class="label-gpu">G7</text>
    <rect x="253" y="150" width="25" height="30" class="gpu-box" /><text x="265.5" y="168" class="label-gpu">G8</text>
    <!-- NVSwitch Bus -->
    <rect x="22" y="200" width="256" height="6" class="bus" />
    <!-- Connections -->
    <line x1="34.5" y1="180" x2="34.5" y2="200" class="conn-tp" />
    <line x1="67.5" y1="180" x2="67.5" y2="200" class="conn-tp" />
    <line x1="100.5" y1="180" x2="100.5" y2="200" class="conn-tp" />
    <line x1="133.5" y1="180" x2="133.5" y2="200" class="conn-tp" />
    <line x1="166.5" y1="180" x2="166.5" y2="200" class="conn-tp" />
    <line x1="199.5" y1="180" x2="199.5" y2="200" class="conn-tp" />
    <line x1="232.5" y1="180" x2="232.5" y2="200" class="conn-tp" />
    <line x1="265.5" y1="180" x2="265.5" y2="200" class="conn-tp" />
  </g>

  <!-- CP Node B -->
  <rect x="420" y="380" width="300" height="160" class="node-box" />
  <text x="570" y="400" class="label title">节点 B (处理 500K - 1M Token)</text>
  <text x="570" y="415" class="subtitle label">机内 TP=8</text>
  <text x="570" y="430" class="subtitle label">📦 权重：1-40层</text>
  <text x="570" y="445" class="subtitle label">💾 KV Cache：500K-1M Token (1-40层)</text>
  <!-- GPUs -->
  <g transform="translate(420, 300)">
    <rect x="22" y="150" width="25" height="30" class="gpu-box" /><text x="34.5" y="168" class="label-gpu">G1</text>
    <rect x="55" y="150" width="25" height="30" class="gpu-box" /><text x="67.5" y="168" class="label-gpu">G2</text>
    <rect x="88" y="150" width="25" height="30" class="gpu-box" /><text x="100.5" y="168" class="label-gpu">G3</text>
    <rect x="121" y="150" width="25" height="30" class="gpu-box" /><text x="133.5" y="168" class="label-gpu">G4</text>
    <rect x="154" y="150" width="25" height="30" class="gpu-box" /><text x="166.5" y="168" class="label-gpu">G5</text>
    <rect x="187" y="150" width="25" height="30" class="gpu-box" /><text x="199.5" y="168" class="label-gpu">G6</text>
    <rect x="220" y="150" width="25" height="30" class="gpu-box" /><text x="232.5" y="168" class="label-gpu">G7</text>
    <rect x="253" y="150" width="25" height="30" class="gpu-box" /><text x="265.5" y="168" class="label-gpu">G8</text>
    <!-- NVSwitch Bus -->
    <rect x="22" y="200" width="256" height="6" class="bus" />
    <!-- Connections -->
    <line x1="34.5" y1="180" x2="34.5" y2="200" class="conn-tp" />
    <line x1="67.5" y1="180" x2="67.5" y2="200" class="conn-tp" />
    <line x1="100.5" y1="180" x2="100.5" y2="200" class="conn-tp" />
    <line x1="133.5" y1="180" x2="133.5" y2="200" class="conn-tp" />
    <line x1="166.5" y1="180" x2="166.5" y2="200" class="conn-tp" />
    <line x1="199.5" y1="180" x2="199.5" y2="200" class="conn-tp" />
    <line x1="232.5" y1="180" x2="232.5" y2="200" class="conn-tp" />
    <line x1="265.5" y1="180" x2="265.5" y2="200" class="conn-tp" />
  </g>

  <!-- CP Communication Stage 1 -->
  <line x1="380" y1="450" x2="420" y2="450" class="bi-arrow conn-cp" />
  <text x="400" y="440" class="subtitle label text-cp">CP 环形通信</text>

  <!-- PP Communication -->
  <line x1="230" y1="340" x2="230" y2="260" class="arrow conn-pp" />
  <text x="220" y="300" class="subtitle label text-pp" text-anchor="end">PP 激活值传递 (1-500K)</text>

  <line x1="570" y1="340" x2="570" y2="260" class="arrow conn-pp" />
  <text x="580" y="300" class="subtitle label text-pp" text-anchor="start">PP 激活值传递 (500K-1M)</text>

  <!-- Sequence Slicing (Input) -->
  <rect x="150" y="610" width="245" height="30" class="box" fill="#FED7D7" stroke="#C53030" />
  <text x="272.5" y="630" class="label title text-cp">序列前半段 (1 - 500K Token)</text>

  <rect x="405" y="610" width="245" height="30" class="box" fill="#FED7D7" stroke="#C53030" />
  <text x="527.5" y="630" class="label title text-cp">序列后半段 (500K - 1M Token)</text>

  <!-- Arrows from Sequence to Stage 1 -->
  <line x1="272.5" y1="610" x2="230" y2="540" class="arrow conn-cp" />
  <line x1="527.5" y1="610" x2="570" y2="540" class="arrow conn-cp" />

  <!-- Legend -->
  <rect x="50" y="660" width="700" height="110" rx="5" fill="#FFF" stroke="#E2E8F0" />
  <text x="70" y="685" class="subtitle"><tspan class="text-tp">■ TP (张量并行)</tspan>: 机内 8 卡通过 NVSwitch/NVLink 总线进行 All-Reduce 同步</text>
  <text x="70" y="705" class="subtitle"><tspan class="text-cp">■ CP (上下文并行)</tspan>: 序列切块分发至不同节点，跨机 Ring Attention 传递 KV Cache</text>
  <text x="70" y="725" class="subtitle"><tspan class="text-pp">■ PP (流水线并行)</tspan>: 跨机按层切分，阶段间传递激活值 (Activations)</text>
  <text x="70" y="745" class="subtitle">💡 效益: 每台机器仅需加载 1/2 权重与 1/4 KV Cache，大幅降低单机显存需求</text>
</svg>
