<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <style>
    .axis { stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); }
    .axis-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #2D3748; font-weight: 600; }
    .cube-face { stroke: #718096; stroke-width: 1; }
    .cube-face-front { fill: #EBF8FF; opacity: 0.5; }
    .cube-face-top { fill: #FFF5F5; opacity: 0.5; }
    .cube-face-right { fill: #FFFFF0; opacity: 0.5; }
    .cut-plane-tp { fill: #2B6CB0; opacity: 0.6; stroke: #2B6CB0; stroke-width: 1.5; }
    .cut-plane-pp { fill: #D69E2E; opacity: 0.6; stroke: #D69E2E; stroke-width: 1.5; }
    .cut-plane-cp { fill: #C53030; opacity: 0.6; stroke: #C53030; stroke-width: 1.5; }
    .leader-line-tp { stroke: #2B6CB0; stroke-width: 1.5; stroke-dasharray: 2,2; }
    .leader-line-pp { stroke: #D69E2E; stroke-width: 1.5; stroke-dasharray: 2,2; }
    .leader-line-cp { stroke: #C53030; stroke-width: 1.5; stroke-dasharray: 2,2; }
    .dimension-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #4A5568; }
    .title-text { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; fill: #1A202C; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568" />
    </marker>
    <marker id="dot-tp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="5" fill="#2B6CB0" />
    </marker>
    <marker id="dot-pp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="5" fill="#D69E2E" />
    </marker>
    <marker id="dot-cp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="5" fill="#C53030" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7FAFC" />

  <g transform="translate(150, 50) scale(0.8)">
    <!-- Axes -->
    <line x1="150" y1="300" x2="400" y2="300" class="axis" />
    <text x="410" y="305" class="axis-label">隐藏维度 d (Dimension)</text>

    <line x1="150" y1="300" x2="150" y2="100" class="axis" />
    <text x="90" y="90" class="axis-label">网络层数 L (Layers)</text>

    <line x1="150" y1="300" x2="50" y2="400" class="axis" />
    <text x="10" y="420" class="axis-label">序列长度 N (Tokens)</text>

    <!-- Cube -->
    <polygon points="150,300 300,300 300,150 150,150" fill="#EDF2F7" stroke="#CBD5E0" />

    <!-- Internal Cutting Planes -->
    <polygon points="225,300 225,150 175,200 175,350" class="cut-plane-tp" />
    <polygon points="150,225 300,225 250,275 100,275" class="cut-plane-pp" />
    <polygon points="125,325 275,325 275,175 125,175" class="cut-plane-cp" />

    <!-- Cube Faces -->
    <polygon points="150,150 300,150 250,200 100,200" class="cube-face cube-face-top" />
    <polygon points="300,300 300,150 250,200 250,350" class="cube-face cube-face-right" />
    <polygon points="100,200 250,200 250,350 100,350" class="cube-face cube-face-front" />

    <!-- Leader Lines and Labels -->
    <line x1="225" y1="150" x2="225" y2="65" class="leader-line-tp" marker-start="url(#dot-tp)" />
    <text x="225" y="45" class="title-text" fill="#2B6CB0" text-anchor="middle">张量并行 (TP)</text>
    <text x="225" y="57" class="dimension-text" text-anchor="middle">切分 d 轴 (隐藏维度)</text>
    
    <line x1="300" y1="225" x2="370" y2="225" class="leader-line-pp" marker-start="url(#dot-pp)" />
    <text x="380" y="220" class="title-text" fill="#D69E2E">流水线并行 (PP)</text>
    <text x="380" y="232" class="dimension-text">切分 L 轴 (网络层)</text>
    
    <line x1="125" y1="175" x2="40" y2="175" class="leader-line-cp" marker-start="url(#dot-cp)" />
    <text x="30" y="170" class="title-text" fill="#C53030" text-anchor="end">上下文并行 (CP)</text>
    <text x="30" y="182" class="dimension-text" text-anchor="end">切分 N 轴 (序列长度)</text>

    <!-- Legend -->
    <rect x="50" y="430" width="400" height="45" rx="5" fill="#FFF" stroke="#E2E8F0" />
    <text x="70" y="448" class="title-text">计算量与 L, N, d 强相关</text>
    <text x="70" y="465" class="dimension-text">彩色引线从切面角点引出，指示并行策略</text>
  </g>
</svg>
